<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Spinix AI</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #09090b;
    --panel: #14151a;
    --border: #2a2c35;
    --yellow: #ffb800;
    --yellow-hover: #e6a600;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --radius: 12px;
  }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Roboto', sans-serif;
    min-height:100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
  }
  .auth-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  h2 {
    text-align: center;
    color: var(--yellow);
    margin-top: 0;
    margin-bottom: 1.5rem;
  }
  .form-group {
    margin-bottom: 1rem;
  }
  label {
    display: block;
    margin-bottom: 0.5rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  input[type="text"], input[type="password"], input[type="email"] {
    width: 100%;
    padding: 0.75rem;
    border-radius: 8px;
    background: #1e1f26;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    box-sizing: border-box;
  }
  input:focus {
    border-color: var(--yellow);
  }
  button {
    width: 100%;
    padding: 0.75rem;
    border-radius: 8px;
    background: var(--yellow);
    color: #000;
    font-weight: bold;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 1rem;
  }
  button:hover {
    background: var(--yellow-hover);
  }
  .links {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.9rem;
  }
  .links a {
    color: var(--yellow);
    text-decoration: none;
  }
  .links a:hover {
    text-decoration: underline;
  }
  .error {
    color: #e11d48;
    background: rgba(225,29,72,0.1);
    border: 1px solid #e11d48;
    padding: 0.5rem;
    border-radius: 6px;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    text-align: center;
  }
</style>
</head>
<body>

<div class="auth-box">
  <h2>Create Account</h2>
  
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  
  <form method="POST" action="/register/">
    {% csrf_token %}
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit">Register</button>
  </form>
  
  <div class="links">
    Already have an account? <a href="/login/">Log in here</a>
  </div>
</div>

</body>
</html>
